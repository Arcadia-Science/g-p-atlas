[project]
name = "g-p-atlas"
version = "0.0.0"
description = "A Python package for training and evaluating nonlinear genotype-phenotype models."
authors = [{ name = "Arcadia Science", email = "info@arcadiascience.com" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "numpy<2.0",
    "torch>=2.6.0,<3",
    "scipy>=1.15.2,<2",
    "captum>=0.8.0,<0.9",
    "pydantic>=2.11.1,<3",
    "h5py>=3.13.0,<4",
    "matplotlib>=3.10.1,<4",
    "scikit-learn>=1.6.1,<2",
    "click>=8.1.8,<9",
    "pyyaml>=6.0.2,<7",
]

[project.urls]
Homepage = "https://github.com/Arcadia-Science/g-p-atlas"
Repository = "https://github.com/Arcadia-Science/g-p-atlas"
Documentation = "https://github.com/Arcadia-Science/g-p-atlas/blob/main/README.md"

[dependency-groups]
dev = [
    "pre-commit==3.5.0",
    "pyright>=1.1.367,<2",
    "pytest==8.2.1",
    "ruff==0.4.4",
]

[project.optional-dependencies]
modal = [
    "modal>=0.74.12",
    "python-dotenv>=1.1.0",
]

[project.scripts]
gpatlas = "gpatlas.cli.gpatlas:cli"


[build-system]
requires = ["uv", "setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
default-groups = [
    "dev",
]

[tool.setuptools]
package-dir = { "" = "gpatlas" }

[tool.setuptools.packages.find]
where = ["gpatlas"]
exclude = ["envs*", "ignore*", "external*"]

[tool.ruff]
# The directories to consider when resolving first- vs. third-party imports.
src = ["."]
line-length = 100
indent-width = 4
extend-include = ["*.ipynb"]
extend-exclude = ['external/*']

[tool.ruff.lint.per-file-ignores]
# Ignore star and unused imports.
"__init__.py" = ["F403", "F405"]

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "W",  # pycodestyle warning
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
order-by-type = true
no-lines-before = ["future", "standard-library"]

[tool.pyright]
typeCheckingMode = "basic"
exclude = ["./.venv", "./dist", "./external"]

# Pyright reports a lot of unknown-member errors for some packages.
# If this is a problem, set this to `false`.
reportUnknownMemberType = false
